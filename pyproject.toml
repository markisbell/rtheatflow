[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rtheatflow"
version = "0.0.1"
description = "Realtime pandapipes district-heating simulator: supply/return hydraulics + thermal state, live map, three-layer observability"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Markus Bell" }]
dependencies = [
    "pandapipes==0.14.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# httpx2: starlette >= 1.3 TestClient prefers it over httpx (deprecation)
# pandapower: scripts/ + test_transient_m7 import it directly — declare it;
# the version is owned by pandapipes' exact ==3.3.3 pin (never pin it here)
dev = ["pytest>=8.0", "httpx>=0.27", "httpx2", "pandapower"]
profiles = ["demandlib>=0.2", "opendhw>=0.2.8"]

[project.scripts]
rtheatflow = "rtheatflow.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
